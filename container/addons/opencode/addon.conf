# OpenCode. It follows the newest release: SwarmBox installs it with npm (swarmbox addon install opencode --force gets the newest again), so UPDATE
# stays managed. The npm package name is NOT here: it is the one variable PACKAGE at the top of install.sh. shell.sh defines the auto-approve
# function: --auto is accepted by `opencode` and `opencode run`, not before a subcommand.
SCHEMA=1
NAME=opencode
DESCRIPTION="OpenCode, an open source coding agent"
VERSION=latest
COMMANDS="opencode"
