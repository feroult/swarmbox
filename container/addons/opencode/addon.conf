# OpenCode. Pinned, installed by SwarmBox with npm (the next version comes with the next image: swarmbox addon install opencode --force).
# The npm package name is NOT here: it is the one variable PACKAGE at the top of install.sh.
# shell.sh defines the auto-approve function: --auto is accepted by `opencode` and `opencode run`, not before a subcommand.
# VERSION 2.3.0 was the "latest" dist-tag of @opencode/cli on npm on 2026-11-15 (npm view @opencode/cli dist-tags).
SCHEMA=1
NAME=opencode
DESCRIPTION="OpenCode, an open source coding agent"
VERSION=2.3.0
COMMANDS="opencode"
