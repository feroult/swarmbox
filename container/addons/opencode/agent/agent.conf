# OpenCode as an agent of SwarmBox (docs/agents-design.md 3.2). Read by swarmbox_agents.py and agents.mjs without running it:
# KEY=value, optional double quotes, no $ \ ` or quotes inside a value; lists are words separated by spaces.
# Its shell function stays in the addon's shell.sh (--auto only for the plain form and `run`), so no YOLO_ARGS here.
SCHEMA=1
ID=opencode
CMD=opencode
LABEL=OpenCode
COLOR="#8ad7e6"
PRINT_FLAGS=""
RESUME_ARGS="--continue"
RESUME_FAST_FAIL_S=4
RESUME_SCOPE=cwd
STATUS=osc7501
RESERVED_PREFIXES="/ !"
SECRET_ENV="OPENAI_API_KEY"
SECRET_FILES=".local/share/opencode/auth.json"
