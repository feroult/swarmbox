# The sysop: an agent loop that operates the box from a goal (docs/addons-design.md). It subscribes to the topic of `sysop.topic` (default `goal`) of
# swarmbox-bus, in the group `sysop.group`, runs a brain (a command that speaks MCP, by default the one an agent declares, Claude Code's one-shot mode) and gives it a few tools that read
# and type into the tabs through the command swarmbox-tabs, never through the bus; the
# host rates every action, and the panel shows a countdown or asks first. Its own code only: stdlib Python, nothing is downloaded, so the
# install is a copy. Pinned: VERSION is the version of this code (swarmbox_sysop.__version__ must equal it).
SCHEMA=1
NAME=sysop
DESCRIPTION="Agent that operates the box from a goal"
VERSION=1.0.0
COMMANDS="swarmbox-sysop"
