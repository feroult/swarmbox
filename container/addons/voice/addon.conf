# Voice control: whisper.cpp (built from source at install, CPU only), one multilingual Whisper model, and the small service
# of the `voice` addon, an input that publishes goals on the bus (docs/voice.md, docs/voice-design.md). Pinned: VERSION is the whisper.cpp release.
# The source tarball is the same for both architectures and its checksum is a constant of install.sh (WHISPER_SRC_SHA256), not a
# SHA256_<arch> key. Nothing is installed at image build: the first `swarmbox-voice` or `swarmbox addon install voice` builds it.
SCHEMA=1
NAME=voice
DESCRIPTION="Speak goals: microphone, Whisper"
VERSION=1.9.5
COMMANDS="swarmbox-voice"
