# OpenAI Codex CLI as an agent of SwarmBox (docs/agents-design.md 3.2). Read by swarmbox_agents.py and agents.mjs without running it:
# KEY=value, optional double quotes, no $ \ ` or quotes inside a value; lists are words separated by spaces.
# The flags come from `codex --help` and `codex resume --help` of 0.172.0; the box is the sandbox, so Codex's own is bypassed.
SCHEMA=1
ID=codex
LABEL="OpenAI Codex"
COLOR="#6ee7b7"
# the native program is named codex too (vendor/<target>/bin/codex), under the Node launcher
YOLO_ARGS="--dangerously-bypass-approvals-and-sandbox"
# subcommands that manage Codex rather than start a session: no flags (the parent's flags are accepted before any of them, measured)
PASSTHROUGH="login logout mcp app-server remote-control completion update doctor sandbox debug apply a queue archive delete migrate-rollouts migrate-nfs-db unarchive cloud exec-server features help agents"
# its one-shot forms are subcommands: a call that names one is not a session (no worktree guard)
PRINT_FLAGS="exec e review"
# `codex resume --last` continues the most recent session of the current folder (its picker filters by cwd unless --all)
RESUME_ARGS="resume --last"
RESUME_FAST_FAIL_S=4
RESUME_SCOPE=cwd
# whether Codex reports its state with OSC 7501 is not measured: without it, its state is unknown and the sysop is careful
STATUS=none
RESERVED_PREFIXES="/ !"
SECRET_ENV="OPENAI_API_KEY CODEX_API_KEY"
SECRET_FILES=".codex/auth.json"
