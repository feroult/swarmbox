# Gemini CLI. It follows the newest release: SwarmBox installs it with npm (swarmbox addon install gemini --force gets the newest again); the CLI
# has no update command of its own, so UPDATE stays managed. The package name is the variable PACKAGE at the top of install.sh (same rule as
# opencode). shell.sh defines the auto-approve function.
SCHEMA=1
NAME=gemini
DESCRIPTION="Gemini CLI, Google's coding agent"
VERSION=latest
COMMANDS="gemini"
