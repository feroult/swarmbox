# Gemini CLI (DEPRECATED: Google stopped serving it for most accounts on 2026-06-18; it still works with a paid Gemini API key. The successor is the addon antigravity). It follows the newest release: SwarmBox installs it with npm (swarmbox addon install gemini --force gets the newest again); the CLI
# has no update command of its own, so UPDATE stays managed. The package name is the variable PACKAGE at the top of install.sh (same rule as
# opencode). shell.sh defines the auto-approve function.
SCHEMA=1
NAME=gemini
DESCRIPTION="Gemini CLI (deprecated: only works with a paid API key; use antigravity)"
VERSION=latest
COMMANDS="gemini"
