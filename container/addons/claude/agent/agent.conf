# Claude Code as an agent of SwarmBox (docs/agents-design.md 3.2). Read by swarmbox_agents.py and agents.mjs without running it:
# KEY=value, optional double quotes, no $ \ ` or quotes inside a value; lists are words separated by spaces.
SCHEMA=1
ID=claude
CMD=claude
LABEL="Claude Code"
# claude-code: the `app` Claude Code reports in its terminal status (OSC 7501)
ALIASES="claude-code"
COLOR="#f4a27f"
YOLO_ARGS="--dangerously-skip-permissions"
# the box's MCP servers, in the file agent/mcp.sh writes from the box's list at every start
MCP_ARGS="--mcp-config {home}/.claude/mcp-servers.json"
# the repository digest of the commit a session starts on (the sysop's autocontext), added to the end of the system prompt; only when it exists
CONTEXT_ARGS="--append-system-prompt-file {context_file}"
# subcommands that refuse the flags above: passed through untouched
PASSTHROUGH="agents attach auth auto-mode doctor gateway import install logs mcp plugin plugins purge respawn rm setup-token stop kill ultrareview update upgrade"
# a one-shot call (print mode) is not an interactive session: no worktree guard
PRINT_FLAGS="-p --print --output-format --input-format"
# `claude --continue` resumes the last conversation of the current folder and exits non-zero at once when there is none
RESUME_ARGS="--continue"
RESUME_FAST_FAIL_S=4
RESUME_SCOPE=cwd
STATUS=osc7501
# /slash commands and ! bash mode
RESERVED_PREFIXES="/ !"
SECRET_ENV="ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN"
SECRET_FILES=".claude/.credentials.json .claude.json"
# The Allow / Cancel card of the Web Studio: keys pressed in a permission dialog (a menu: 1 picks "Yes", Esc cancels). Measured with
# Claude Code 2.1: a number key picks its option, Esc cancels, and a typed letter does nothing (Enter then confirms the highlighted option).
ANSWER_ALLOW=1
ANSWER_DENY=esc
# agent/settings.json is seeded into this file once (the status line of the box); a key the user has always wins
SETTINGS_FILE=.claude/settings.json
# The prompt history (the sysop names a tab after what was asked): one JSON line per typed prompt, `display`, `project` (the cwd),
# `sessionId`, `timestamp` in ms. CLAUDE_CONFIG_DIR, when set, is the folder of the file instead of ~/.claude.
HISTORY=jsonl
HISTORY_FILE=.claude/history.jsonl
HISTORY_FILE_ENV=CLAUDE_CONFIG_DIR
HISTORY_FIELDS="project sessionId display timestamp"
# The sysop: the brain of a goal (a preset named after the agent: `sysop.brain claude`), and the tab namer, a one-shot call with its own
# system prompt, nothing it may run, no MCP, no settings (the request goes on standard input). Placeholders: see docs/agents-design.md 3.2.
# The brain is hermetic (docs/sysop-brain-design.md): no built-in program (--tools ''), only the sysop's MCP server, no user or project
# settings (--setting-sources '': their hooks would run commands inside the brain), no hooks at all (brain-settings.json, in this read-only
# folder), no slash commands or skills, and a configuration folder of its own (BRAIN_HOME_ENV, set by the sysop to its brain home).
# It is resident (docs/sysop-resident-brain-design.md): --input-format stream-json keeps one process across goals, a goal is one message on
# its standard input and Stop an interrupt of the turn; no --max-turns (the MCP server's policy counts the steps of a goal).
BRAIN="claude -p --model {model} --mcp-config {mcp_config} --strict-mcp-config --tools '' --allowedTools 'mcp__sysop__*' --permission-mode dontAsk --setting-sources '' --settings {agent_dir}/brain-settings.json --disable-slash-commands --system-prompt {system_prompt} --input-format stream-json --output-format stream-json --include-partial-messages --verbose"
BRAIN_FORMAT=claude-stream-json
BRAIN_RESUME="--resume {session_id}"
# SIGINT first when the process must go (a brain run once per goal; a resident one is interrupted, then its input is closed): Claude Code
# writes its result and its session before it exits (measured: 1.3 s)
BRAIN_STOP=INT
BRAIN_HOME_ENV=CLAUDE_CONFIG_DIR
BRAIN_LOGIN_FAILURE="Not logged in|Please run /login|Invalid API key|OAuth token has expired|authentication_error|Credit balance is too low"
MODEL=sonnet
NAMER="claude -p --model {model} --system-prompt {system_prompt} --tools '' --strict-mcp-config --setting-sources '' --no-session-persistence --output-format text"
NAMER_MODEL=haiku
# The repository digest (sysop.autocontext): a one-shot call like the namer's, with the digest's own system prompt; the repository's README,
# manifests and file list go on standard input.
DIGEST="claude -p --model {model} --system-prompt {system_prompt} --tools '' --strict-mcp-config --setting-sources '' --no-session-persistence --output-format text"
DIGEST_MODEL=haiku
LOGIN_HINT="Add a token: claude setup-token in a tab prints one, then swarmbox env add CLAUDE_CODE_OAUTH_TOKEN and swarmbox reset (a login made in a tab with claude, then /login, serves the tabs and the tab names, not the sysop's brain)"
