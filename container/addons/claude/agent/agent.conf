# Claude Code as an agent of SwarmBox (docs/agents-design.md 3.2). Read by swarmbox_agents.py and agents.mjs without running it:
# KEY=value, optional double quotes, no $ \ ` or quotes inside a value; lists are words separated by spaces.
SCHEMA=1
ID=claude
CMD=claude
LABEL="Claude Code"
# claude-code: the `app` Claude Code reports in its terminal status (OSC 7501)
ALIASES="claude-code"
COLOR="#f4a27f"
YOLO_ARGS="--dangerously-skip-permissions"
# the box's MCP servers, in the file agent/mcp.sh writes from the box's list at every start
MCP_ARGS="--mcp-config {home}/.claude/mcp-servers.json"
# subcommands that refuse the flags above: passed through untouched
PASSTHROUGH="agents attach auth auto-mode doctor gateway import install logs mcp plugin plugins purge respawn rm setup-token stop kill ultrareview update upgrade"
# a one-shot call (print mode) is not an interactive session: no worktree guard
PRINT_FLAGS="-p --print --output-format --input-format"
# `claude --continue` resumes the last conversation of the current folder and exits non-zero at once when there is none
RESUME_ARGS="--continue"
RESUME_FAST_FAIL_S=4
RESUME_SCOPE=cwd
STATUS=osc7501
# /slash commands and ! bash mode
RESERVED_PREFIXES="/ !"
SECRET_ENV="ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN"
SECRET_FILES=".claude/.credentials.json .claude.json"
# The Allow / Cancel card of the Web Studio: keys pressed in a permission dialog (a menu: 1 picks "Yes", Esc cancels). Measured with
# Claude Code 2.1: a number key picks its option, Esc cancels, and a typed letter does nothing (Enter then confirms the highlighted option).
ANSWER_ALLOW=1
ANSWER_DENY=esc
# agent/settings.json is seeded into this file once (the status line of the box); a key the user has always wins
SETTINGS_FILE=.claude/settings.json
