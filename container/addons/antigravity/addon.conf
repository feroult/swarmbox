# Antigravity CLI (command agy), Google's coding agent and the successor of Gemini CLI. It is closed source, a native Go binary that updates
# itself in the background (and with `agy update`): SwarmBox downloads it once and leaves it alone, like claude (UPDATE=self, the program lives
# in ~/.local/bin/agy). shell.sh defines the auto-approve function (--dangerously-skip-permissions).
SCHEMA=1
NAME=antigravity
DESCRIPTION="Antigravity CLI (agy), Google's coding agent (replaces Gemini CLI)"
VERSION=latest
COMMANDS="agy"
UPDATE=self
UPDATE_CMD="agy update"
