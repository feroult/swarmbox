# Antigravity CLI (agy) as an agent of SwarmBox (docs/agents-design.md 3.2). Read by swarmbox_agents.py and agents.mjs without running it:
# KEY=value, optional double quotes, no $ \ ` or quotes inside a value; lists are words separated by spaces.
SCHEMA=1
ID=agy
CMD=agy
LABEL=Antigravity
# antigravity: the addon's name and the `app` agy reports in its terminal status (OSC 7501); the binary inside its tarball is named so too
ALIASES="antigravity"
COLOR="#c4b5fd"
YOLO_ARGS="--dangerously-skip-permissions"
PASSTHROUGH="acp agent agents changelog help install mcp mic-serve models plugin plugins remote-control update"
PRINT_FLAGS="-p --print"
# the repository digest of the commit a session starts on (the sysop's autocontext): agy has no system prompt flag; it reads AGENTS.md of
# a folder added to its workspace as rules (measured with 1.5.18: the model knew what only that file said), so the launcher hands it a
# folder holding the digest as AGENTS.md; only when it exists
CONTEXT_ARGS="--add-dir {context_dir}"
# agy 1.5.17 accepts --continue ("the most recent conversation"); whether that is the one of the current folder is not documented
RESUME_ARGS="--continue"
RESUME_FAST_FAIL_S=4
RESUME_SCOPE=global
STATUS=osc7501
RESERVED_PREFIXES="/ !"
SECRET_ENV="GEMINI_API_KEY GOOGLE_API_KEY"
SECRET_FILES=".gemini/oauth_creds.json .gemini/google_accounts.json .gemini/antigravity-cli/antigravity-oauth-token"
# agent/settings.json is seeded into this file once: the addon's status line, a dark colour scheme, no surveys, access outside the
# workspace (the box is the sandbox). agy drops keys equal to its defaults when it saves /config, so seeding again would undo a choice.
SETTINGS_FILE=.gemini/antigravity-cli/settings.json
# The prompt history (the sysop names a tab after what was asked): Claude Code's shape, with `workspace` and `conversationId`
HISTORY=jsonl
HISTORY_FILE=.gemini/antigravity-cli/history.jsonl
HISTORY_FIELDS="workspace conversationId display timestamp"
