# SwarmBox default tmux configuration, installed as /etc/tmux.conf.
#
# Nothing else is needed for it to work: it does not depend on anything in your workspace. Your own
# ~/.tmux.conf (in the container; <workspace>/.tmux.conf on the host) is read AFTER this file, so add to it or
# override anything there (unbind -n M-n, set -g prefix C-b, a different theme, ...).
#
# It also loads tmux-browser-keys.conf from the same directory: Alt-based shortcuts that work in a browser
# terminal, and a [+] button in the status bar.

# --- Prefix: Ctrl+A ---------------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Shell: zsh when the image has it; otherwise the login shell (bash, which carries the claude alias)
if-shell "test -x /usr/bin/zsh" "set -g default-shell /usr/bin/zsh"

# --- Full true color --------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Mouse: click windows and panes, scroll -------------------------------------------------------
set -g mouse on

# --- Numbering from 1 (windows and panes) ----------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Scrollback: 50,000 lines -----------------------------------------------------------------------
set -g history-limit 50000

# --- Scrollbar: off ---------------------------------------------------------------------------------------------------
# tmux 3.6 and later (the image carries 3.7c) can draw a one-column bar on the right of the pane. It is off: the pane keeps its whole width.
# In copy mode tmux still shows where you are (`[position/total]`, top
# right) and the mouse wheel scrolls 5 lines per event. `set -g pane-scrollbars on` in your own ~/.tmux.conf (read after this file) brings it back,
# `modal` shows it only in copy mode (the pane is then one column narrower each time copy mode starts or ends, and the program in it is resized),
# and `set -g pane-scrollbars-style "bg=default,fg=colour238,width=1"` sets its colors and width.
# -q: an older tmux (3.5 and earlier, which has no such option) ignores the line instead of failing to load this file.
set -gq pane-scrollbars off

# --- Split and open windows in the current directory -----------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move the current window left/right (prefix + < or >)
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# --- No ESC delay (avoids lag in Vim/Neovim) -------------------------------------------------------
set -s escape-time 0

# --- Pass focus events and extended keys through ---------------------------------------------------
set -g focus-events on
set -s extended-keys on

# --- Theme: the colors of the banner and of the prompt ------------------------------------------------------------
# Dark gray and violet. The words are gray, the dashes darker gray, the accent violet, and the current window sits on the same
# soft band as the directory of the prompt, with a dithered ▒ at each edge. The band means "where you are": nothing else gets it,
# and the session name is not shown (it is "main", or a name made for each terminal tab). The other windows have a space where the
# current one has its ▒, so every window is always the same width and nothing moves when you change window.
#   #52525b  dashes     #71717a  dim text     #a1a1aa  text     #c4b5fd  light violet     #a78bfa  violet
#   #27222f  the band   #3f3f46  quiet lines  #6d28d9  deep violet (borders, selection)
set -g status-position bottom
set -g status-style "bg=default,fg=#71717a"
set -g status-left ""
set -g status-left-length 10
set -g status-right " #[fg=#52525b]─ #[fg=#71717a]%d/%m #[fg=#52525b]─ #[fg=#a1a1aa]%H:%M #[default]"
setw -g window-status-format " #[fg=#71717a] #I #W  "
setw -g window-status-current-format "#[fg=#27222f]▒#[bg=#27222f,fg=#a78bfa,bold] #I #W #[bg=default,fg=#27222f]▒#[default]"
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#c4b5fd"
setw -g window-status-bell-style "fg=#f87171,bold"
set -g pane-border-style "fg=#3f3f46"
set -g pane-active-border-style "fg=#6d28d9"
set -g message-style "bg=#27222f,fg=#c4b5fd"
set -g message-command-style "bg=#27222f,fg=#a78bfa"
set -g display-panes-colour "#52525b"
set -g display-panes-active-colour "#a78bfa"
setw -g clock-mode-colour "#a78bfa"
# Copy mode: the selection and the search matches. -q because the match styles are newer than the others.
setw -g mode-style "bg=#6d28d9,fg=#fafafa"
set -gq copy-mode-match-style "bg=#3f3f46,fg=#fafafa"
set -gq copy-mode-current-match-style "bg=#a78bfa,fg=#111111"
set -gq copy-mode-mark-style "bg=#a78bfa,fg=#111111"

# A gap between the terminal and the bar: a two-line status whose top line is empty
# (copy the default format to line 2 and leave line 1 with the terminal background)
set -g status 2
run-shell 'tmux set -gu status-format; tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")"; tmux set -g "status-format[0]" "#[fill=terminal]"'

# --- Mouse wheel in copy mode: 5 lines per event (tmux's own default; 2 was too little to move through 50,000 lines) ---
bind -T copy-mode WheelUpPane send -N5 -X scroll-up
bind -T copy-mode WheelDownPane send -N5 -X scroll-down
bind -T copy-mode-vi WheelUpPane send -N5 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N5 -X scroll-down

# --- Browser-friendly Alt shortcuts and the [+] button (same directory as this file) ------------
source-file -q -F "#{d:current_file}/tmux-browser-keys.conf"
