# SwarmBox default configuration for herdr TUI (Purple Glow palette, see docs/theme.md).
# Copied to ~/.config/herdr/config.toml on first start; user edits there are preserved.
onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
panel_bg = "#0c0b10"
sidebar_bg = "#12101a"
active_row_bg = "#27222f"
selection_bg = "#6d28d9"
accent = "#a78bfa"
text = "#d4d4d8"
red = "#ff6b78"
green = "#4ade80"
yellow = "#fbbf24"
blue = "#8b5cf6"

[terminal]
default_shell = "/bin/bash"
shell_mode = "login"
new_cwd = "follow"
kitty_graphics = true

[keys]
prefix = "ctrl+a"
goto = "prefix+shift+j"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "swarmbox-sysop goal"
width = 76
height = 5

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "swarmbox-sysop approve"

[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = "swarmbox-sysop veto"

[[keys.command]]
key = "prefix+shift+x"
type = "shell"
command = "swarmbox-sysop stop"

[ui]
sidebar_width = 26
sidebar_collapsed_mode = "compact"
pane_borders = "auto"
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
show_agent_labels_on_pane_borders = true
tab_bar_position = "top"
tab_bar_right_separator = " ─ "
status_indicators = "dots"
accent = "#a78bfa"
mouse_scroll_lines = 5
window_title = "SwarmBox · {workspace}"

[[ui.tab_bar_right]]
type = "datetime"
format = "%d/%m ─ %H:%M"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"
