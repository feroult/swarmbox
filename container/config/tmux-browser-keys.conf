# Browser-friendly tmux shortcuts (optional): no prefix, built on Alt.
#
# Why Alt: a browser keeps Ctrl+T/N/W, Ctrl+Tab, Ctrl+1..9 and Ctrl+Shift+T for itself, and xterm.js
# sends nothing at all for Ctrl+Shift+letter, Ctrl+digit or Ctrl+punctuation (or only the plain control
# character the shell already uses). Alt+letter reaches the terminal as ESC+letter. Use the LEFT Alt: on
# an international layout the right one is AltGr and types special characters.
#
# Use it:  the SwarmBox default config (container/config/tmux.conf) already loads this file. With a different config,
#          add:  source-file /path/to/tmux-browser-keys.conf
# It only adds bindings (the prefix keys keep working) and replaces status-left to add a [+] button.
# Alt+1..9 jump to the window with that NUMBER: use `set -g base-index 1` so the keys match the status bar.
#
# Keys it takes from the shell: Alt+N (history search), Alt+W, Alt+L (downcase-word), Alt+R, Alt+X,
# Alt+1..9/0 (numeric argument), Alt+\ and Alt+-; Alt+arrows stop being word jumps (Ctrl+arrows still are).
# Left free on purpose: Alt+. (last argument), Alt+B/F/D (word move/delete), Alt+T and Alt+P.

# --- Windows (the "tabs") -----------------------------------------------------------------------
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-w confirm-before -p "close window #W? (y/n)" kill-window
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-H swap-window -t -1 \; select-window -t -1
bind -n M-L swap-window -t +1 \; select-window -t +1
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 last-window
bind -n M-r command-prompt -I "#W" "rename-window -- '%%'"
bind -n M-g choose-tree -Zw

# --- Panes --------------------------------------------------------------------------------------
bind -n 'M-\' split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3
bind -n M-z resize-pane -Z
bind -n M-x confirm-before -p "close pane? (y/n)" kill-pane

# --- Mouse: a [+] button in the first three columns of the status bar creates a window ------------
# (fixed width, so the click is handled by column whatever the session name is; a range=user inside
# status-left does not work, tmux reports the click as part of the surrounding left range)
set -g status-left "#[bg=#a6e3a1,fg=#1e1e2e,bold] + #[bg=#b4befe,fg=#1e1e2e,bold] #S #[default] "
bind -n MouseDown1StatusLeft if -F '#{<:#{mouse_x},3}' 'new-window -c "#{pane_current_path}"'
