"$schema" = 'https://starship.rs/config-schema.json'

# SwarmBox prompt (Starship), installed as /etc/swarmbox/starship.toml.
#
# Architectural Purple Glow single-line prompt crafted to match the SwarmBox studio UI:
# a razor-sharp violet left edge ("▍") on a subtle dark-violet band for the directory,
# understated middle-dot ("·") dividers, crisp lavender git branch with semantic amber status,
# muted runtime context only when relevant, warm amber command duration (>= 2s), compact non-zero
# exit status, and a clean violet "❯". Zero Nerd Font glyphs so every terminal renders identically.
#
# Every color lives in [palettes.swarmbox] (checked against docs/theme.md by tests/fast/test_theme.py).
# Your own ~/.config/starship.toml, if it exists, is used instead of this file.

add_newline = true   # a blank line above every prompt, so one command does not stick to the output of the one before

format = """\
$username\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
$cmd_duration\
$status\
$time\
$character"""

palette = 'swarmbox'

[palettes.swarmbox]
color_sep = '#52525b'
color_user = '#a1a1aa'
color_path = '#a78bfa'
color_vcs = '#c4b5fd'
color_dim = '#71717a'
color_band = '#27222f'
color_ok = '#a78bfa'
color_err = '#f87171'
color_alt = '#c084fc'
color_warn = '#fbbf24'

[username]
show_always = false
style_user = 'fg:color_user'
style_root = 'bold fg:color_err'
format = '[$user]($style)[ · ](fg:color_sep)'

[directory]
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
home_symbol = '~'
read_only = ' ro'
read_only_style = 'fg:color_err bg:color_band'
format = '[▍](fg:color_ok bg:color_band)[ $path ](bold fg:color_path bg:color_band)[$read_only]($read_only_style)'

[git_branch]
symbol = ''
format = '[ · ](fg:color_sep)[$branch](bold fg:color_vcs)'

[git_status]
conflicted = '×'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count}↓${behind_count}'
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'
format = '[( $all_status$ahead_behind)](fg:color_warn)'

[c]
symbol = 'c '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[cpp]
symbol = 'c++ '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[rust]
symbol = 'rs '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[golang]
symbol = 'go '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[nodejs]
symbol = 'node '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[bun]
symbol = 'bun '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[php]
symbol = 'php '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[java]
symbol = 'java '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[kotlin]
symbol = 'kt '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[haskell]
symbol = 'hs '
version_format = '${major}.${minor}'
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[python]
symbol = 'py '
version_format = '${major}.${minor}'
detect_env_vars = []
format = '[ · ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[docker_context]
symbol = ''
format = '[ · ](fg:color_sep)[$context](fg:color_dim)'

[conda]
symbol = 'conda '
format = '[ · ](fg:color_sep)[$symbol$environment](fg:color_dim)'

[pixi]
symbol = 'pixi '
format = '[ · ](fg:color_sep)[$symbol($version)( $environment)](fg:color_dim)'

[cmd_duration]
min_time = 2000
format = '[ · ](fg:color_sep)[$duration](fg:color_warn)'

[status]
disabled = false
format = '[ · ](fg:color_sep)[✕ $status](bold fg:color_err)'

[time]
disabled = false
time_format = '%R'
format = '[ · ](fg:color_sep)[$time](fg:color_sep)'

[character]
format = ' $symbol '
success_symbol = '[❯](bold fg:color_ok)'
error_symbol = '[❯](bold fg:color_err)'
vimcmd_symbol = '[❮](bold fg:color_ok)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_alt)'
vimcmd_replace_symbol = '[❮](bold fg:color_alt)'
vimcmd_visual_symbol = '[❮](bold fg:color_warn)'
