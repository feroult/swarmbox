"$schema" = 'https://starship.rs/config-schema.json'

# SwarmBox prompt (Starship), installed as /etc/swarmbox/starship.toml.
#
# One line, in the style of the banner above it: thin "─" separators in dark gray, the words in gray and violet, the directory
# on a soft band whose edges fade in and out with the dithered "░▒▓" of the old BBS screens, and a violet "❯" at the end. No Nerd Font glyph anywhere, so it looks the same in any terminal font: the language symbols are short words
# (py, go, node...), not icons. A segment appears only when it has something to say: the user and the directory always, the
# branch inside a repository, a language inside a project of it, the Docker context, and the time.
# Every color lives in the palette table below, named by ROLE (color_sep, color_path, ...): recolor the prompt there,
# nowhere else.
#
# Your own ~/.config/starship.toml, if it exists, is used instead of this file.

add_newline = true   # a blank line above every prompt, so one command does not stick to the output of the one before

format = """
[╶](fg:color_sep)\
$username\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
$time\
$character"""

palette = 'swarmbox'

[palettes.swarmbox]
color_sep = '#52525b'
color_user = '#a1a1aa'
color_path = '#a78bfa'
color_vcs = '#c4b5fd'
color_dim = '#71717a'
color_band = '#27222f'
color_ok = '#a78bfa'
color_err = '#f87171'
color_alt = '#c084fc'
color_warn = '#fbbf24'

[username]
show_always = true
style_user = ''
style_root = ''
format = '[─ ](fg:color_sep)[$user](fg:color_user)'

[directory]
truncation_length = 2
truncation_symbol = '…/'
format = '[ ─ ](fg:color_sep)[░▒▓](fg:color_band)[ $path ](fg:color_path bg:color_band)[▓▒░](fg:color_band)'

[git_branch]
symbol = ''
format = '[ ─ ](fg:color_sep)[$branch](fg:color_vcs)'

[git_status]
format = '[( $all_status$ahead_behind)](fg:color_vcs)'

[c]
symbol = 'c '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[cpp]
symbol = 'c++ '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[rust]
symbol = 'rs '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[golang]
symbol = 'go '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[nodejs]
symbol = 'node '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[bun]
symbol = 'bun '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[php]
symbol = 'php '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[java]
symbol = 'java '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[kotlin]
symbol = 'kt '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[haskell]
symbol = 'hs '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[python]
symbol = 'py '
format = '[ ─ ](fg:color_sep)[$symbol($version)](fg:color_dim)'

[docker_context]
symbol = ''
format = '[ ─ ](fg:color_sep)[$context](fg:color_dim)'

[conda]
symbol = 'conda '
format = '[ ─ ](fg:color_sep)[$symbol$environment](fg:color_dim)'

[pixi]
symbol = 'pixi '
format = '[ ─ ](fg:color_sep)[$symbol($version)( $environment)](fg:color_dim)'

[time]
disabled = false
time_format = '%R'
format = '[ ─ ](fg:color_sep)[$time](fg:color_dim)'

[character]
format = ' $symbol '
success_symbol = '[❯](bold fg:color_ok)'
error_symbol = '[❯](bold fg:color_err)'
vimcmd_symbol = '[❮](bold fg:color_ok)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_alt)'
vimcmd_replace_symbol = '[❮](bold fg:color_alt)'
vimcmd_visual_symbol = '[❮](bold fg:color_warn)'
