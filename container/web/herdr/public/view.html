<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11111b">
<title>SwarmBox File Viewer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/viewer.css">
</head>
<body>
<div id="standalone-viewer" class="sbv-standalone-root"></div>
<script type="module" src="/viewer.js"></script>
<script type="module">
(async function () {
  'use strict';
  // Sync accent palette with active SwarmBox theme if available
  try {
    const res = await fetch('/api/theme');
    if (res.ok) {
      const data = await res.json();
      if (data && data.theme) document.documentElement.dataset.theme = data.theme;
    }
  } catch (_) {}

  const rootEl = document.getElementById('standalone-viewer');
  const viewer = window.SwarmBoxViewer.createViewer({
    container: rootEl,
    mode: 'standalone',
  });
  window.addEventListener('keydown', (ev) => viewer.handleKey(ev));

  const qs = new URLSearchParams(window.location.search);
  const target = qs.get('path') || '';
  const line = qs.get('line') || '';
  if (target) {
    viewer.open(target, { line: line ? Number(line) : null });
  } else {
    rootEl.querySelector('[data-role="body"]').innerHTML =
      '<div class="sbv-empty">No file path specified. Click any file path in SwarmBox to preview it here.</div>';
  }
})();
</script>
</body>
</html>
