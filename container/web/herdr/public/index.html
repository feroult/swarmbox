<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0b10">
<title>SwarmBox</title>
<link rel="preload" href="/vendor/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<!-- SwarmBox architectural boot splash (zero-delay HTML/CSS, dissolves once herdr-core paints) -->
<div id="sb-boot" aria-hidden="true">
  <div class="boot-stage">
    <div class="boot-mark">
      <svg viewBox="0 0 40 40" width="38" height="38" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="sb-prism" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#e9d5ff"/>
            <stop offset="52%" stop-color="#a78bfa"/>
            <stop offset="100%" stop-color="#6d28d9"/>
          </linearGradient>
        </defs>
        <path d="M20 4.5L33.4 12.25V27.75L20 35.5L6.6 27.75V12.25L20 4.5Z" stroke="url(#sb-prism)" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M20 4.5V20M20 20L33.4 12.25M20 20L6.6 12.25M20 20V35.5" stroke="url(#sb-prism)" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="2.6" fill="#c4b5fd"/>
        <circle cx="20" cy="4.5" r="1.75" fill="#e9d5ff"/>
        <circle cx="33.4" cy="27.75" r="1.75" fill="#a78bfa"/>
        <circle cx="6.6" cy="27.75" r="1.75" fill="#a78bfa"/>
      </svg>
    </div>
    <div class="boot-wordmark">SWARMBOX</div>
    <div class="boot-track"><span class="boot-beam"></span></div>
    <div class="boot-sub">herdr-core</div>
  </div>
</div>

<div id="app" class="app" data-sysop-open="1" data-sidebar-open="1" data-mobile-keys="0" data-mobile-sysop="0">
  <!-- Left Sidebar (Desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">SWARMBOX</span>
        <span class="brand-tag">herdr</span>
      </div>
      <button class="icon-btn" id="btn-sidebar-close" title="Collapse sidebar (Alt+B)" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="section-label">
        <span>Terminals</span>
        <span class="count-pill" id="tab-count">0</span>
      </div>
      <div class="tab-list" id="sidebar-tabs" role="tablist" aria-label="Terminals"></div>
      <div class="spawn-row">
        <button class="spawn-btn" id="btn-new-shell" title="Open a new bash shell tab (Alt+N)">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
          <span>Shell</span>
        </button>
        <button class="spawn-btn spawn-accent" id="btn-new-agent" title="Open the box's default agent">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
          <span>Agent</span>
        </button>
      </div>
    </div>

    <div class="sidebar-foot">
      <label class="theme-picker">
        <span class="theme-label">
          <span class="theme-swatch" id="theme-swatch" aria-hidden="true"></span>
          <span>Theme</span>
        </span>
        <select id="theme-select" aria-label="Select theme">
          <option value="purple-glow">Purple Glow</option>
          <option value="catppuccin">Catppuccin Mocha</option>
          <option value="tokyo-night">Tokyo Night</option>
          <option value="nord">Nord</option>
          <option value="rose-pine">Rosé Pine</option>
        </select>
      </label>
      <div class="font-picker">
        <span class="theme-label"><span>Font</span></span>
        <div class="font-stepper">
          <button type="button" class="font-btn" id="btn-font-dec" title="Smaller text (Alt+-)" aria-label="Decrease font size">−</button>
          <button type="button" class="font-val" id="btn-font-reset" title="Reset default font size (Alt+0)">16.5</button>
          <button type="button" class="font-btn" id="btn-font-inc" title="Larger text (Alt+=)" aria-label="Increase font size">+</button>
        </div>
      </div>
      <div class="conn-pill" id="conn-pill">
        <span class="dot"></span>
        <span id="conn-text">connecting…</span>
      </div>
    </div>
  </aside>

  <!-- Center Stage -->
  <main class="stage">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn desktop-only" id="btn-sidebar-open" title="Show sidebar (Alt+B)" aria-label="Show sidebar">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="active-meta">
          <span class="status-dot" id="active-dot" data-state="idle"></span>
          <span class="active-name" id="active-name">—</span>
          <span class="active-sep desktop-only" aria-hidden="true">─</span>
          <span class="active-status desktop-only" id="active-status">idle</span>
        </div>
      </div>

      <div class="topbar-right">
        <select class="mobile-theme-select mobile-only" id="theme-select-mobile" aria-label="Theme">
          <option value="purple-glow">Purple Glow</option>
          <option value="catppuccin">Catppuccin</option>
          <option value="tokyo-night">Tokyo Night</option>
          <option value="nord">Nord</option>
          <option value="rose-pine">Rosé Pine</option>
        </select>
        <button class="chip-btn" id="btn-interrupt" title="Interrupt active terminal (Ctrl+C / Esc)">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="2"/></svg>
          <span>Stop</span>
        </button>
        <button class="chip-btn chip-toggle desktop-only" id="btn-toggle-sysop" data-on="1" title="Toggle Sysop panel (Alt+S)">
          <span class="toggle-dot" aria-hidden="true"></span>
          <span>Sysop</span>
        </button>
      </div>
    </header>

    <!-- Mobile Tab Strip -->
    <div class="mobile-tabs mobile-only" id="mobile-tabs"></div>

    <!-- Terminal Canvas -->
    <div class="term-wrap" id="term-wrap">
      <div id="terminal"></div>
      <button class="jump-live-btn" id="btn-jump-live" type="button" title="Jump to bottom">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v10m0 0l-4-4m4 4l4-4"/></svg>
        <span>Jump to live</span>
      </button>
    </div>

    <!-- Mobile Bottom Dock (SwarmBox v2.0.24 compact glass dock: collapsible keys + Sysop capsule + Keyboard + Mic) -->
    <div class="mobile-dock mobile-only" id="mobile-dock">
      <div class="mobile-approval hidden" id="mobile-approval">
        <div class="approval-info">
          <span class="approval-badge" id="mobile-approval-badge">ALLOW?</span>
          <span class="approval-msg" id="mobile-approval-msg"></span>
        </div>
        <div class="approval-btns">
          <button class="btn-allow" id="btn-mobile-allow">Allow</button>
          <button class="btn-cancel" id="btn-mobile-cancel">Cancel</button>
        </div>
      </div>

      <div class="touch-keys" id="touch-keys">
        <button data-key="esc">Esc</button>
        <button data-key="tab">Tab</button>
        <button data-key="ctrl+c">^C</button>
        <span class="keys-gap" aria-hidden="true"></span>
        <button data-key="left" aria-label="Left"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 8H5m0 0l3-3M5 8l3 3"/></svg></button>
        <button data-key="up" aria-label="Up"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V5m0 0L5 8m3-3l3 3"/></svg></button>
        <button data-key="down" aria-label="Down"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v6m0 0l-3-3m3 3l3-3"/></svg></button>
        <button data-key="right" aria-label="Right"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h6m0 0L8 5m3 3l-3 3"/></svg></button>
        <button data-key="enter" aria-label="Enter">↵</button>
      </div>

      <div class="mobile-capsule">
        <button class="capsule-main" id="btn-mobile-sysop" data-state="idle" data-on="0">
          <span class="status-dot" id="mobile-sysop-dot" data-state="idle"></span>
          <span class="capsule-text" id="mobile-sysop-text">Sysop</span>
          <span class="capsule-chevron" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>
          </span>
        </button>
        <button class="capsule-kb" id="btn-mobile-kb" data-on="0" title="Keys &amp; keyboard" aria-label="Keys and keyboard" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <g class="kb-body">
              <rect x="2.5" y="5.5" width="19" height="12" rx="2.5"/>
              <path d="M6.5 9.5h.01M10 9.5h.01M13.5 9.5h.01M17 9.5h.01M8 13.5h8"/>
            </g>
            <path class="kb-down" d="M9.5 20l2.5 2 2.5-2"/>
          </svg>
        </button>
        <button class="capsule-mic" id="btn-mobile-mic" title="Hold to speak a goal" aria-label="Voice goal">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Mobile backdrop when Sysop sheet is open -->
  <div class="sheet-backdrop mobile-only" id="sheet-backdrop"></div>

  <!-- Right Sysop Panel (Desktop docked drawer / Mobile bottom sheet) -->
  <aside class="sysop-panel" id="sysop-panel">
    <div class="sheet-handle mobile-only" id="sheet-handle" aria-hidden="true"><span></span></div>
    <div class="sysop-head">
      <div class="sysop-title">
        <span class="status-dot" id="sysop-dot" data-state="idle"></span>
        <span class="sysop-word">SYSOP</span>
        <span class="sysop-state-pill" id="sysop-state">idle</span>
      </div>
      <div class="sysop-head-actions">
        <button class="icon-btn hidden" id="btn-sysop-stop" title="Stop running goal" aria-label="Stop running goal">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="icon-btn" id="btn-tts" title="Toggle spoken feedback" aria-label="Toggle spoken feedback">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
        <button class="icon-btn" id="btn-sysop-close" title="Close Sysop panel (Alt+S)" aria-label="Close">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <!-- Live Approval / Countdown Card -->
    <div class="approval-card hidden" id="approval-card">
      <div class="approval-card-head">
        <span class="approval-badge" id="approval-badge">ALLOW?</span>
        <span class="approval-tab" id="approval-tab"></span>
      </div>
      <p class="approval-text" id="approval-text"></p>
      <div class="approval-bar hidden" id="approval-bar"><div class="approval-bar-fill" id="approval-bar-fill"></div></div>
      <div class="approval-btns">
        <button class="btn-allow" id="btn-allow">Allow</button>
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
      </div>
    </div>

    <!-- Voice Status Note -->
    <div class="voice-note hidden" id="voice-note" role="status"></div>

    <!-- Activity Feed -->
    <div class="sysop-feed" id="sysop-feed"></div>

    <!-- Goal Composer -->
    <div class="sysop-composer">
      <div class="goal-box">
        <textarea id="goal-input" rows="2" placeholder="Describe a goal for Sysop… (Alt+G)"></textarea>
        <div class="goal-actions">
          <button class="mic-btn" id="btn-mic" title="Hold to speak a goal" aria-label="Speak a goal">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            <span class="mic-label" id="mic-label">Speak</span>
          </button>
          <span class="voice-hint" id="voice-hint"></span>
          <button class="send-btn" id="btn-send-goal">Send</button>
        </div>
      </div>
    </div>
  </aside>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-web-links.js"></script>
<script src="/app.js"></script>
</body>
</html>
