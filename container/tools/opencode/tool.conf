# OpenCode. An agent that is installed and updated by SwarmBox (managed), like every npm tool.
# The npm package name is NOT here: it is the one variable PACKAGE at the top of install.sh.
SCHEMA=1
NAME=opencode
KIND=agent
PROVIDES="opencode"
VERSION=latest
MCP_FORMAT=opencode
# --auto is accepted by `opencode` and `opencode run`, not before a subcommand, so no alias is generated: only `yolo` uses it.
YOLO_FLAGS="--auto"
YOLO_ALIAS=0
