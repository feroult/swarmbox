# OpenCode (design 6.3, 6.6, 6.12). An agent that is installed and updated by SwarmBox (managed, D3), like every npm tool.
# The npm package name is NOT here: it is the one variable PACKAGE at the top of install.sh (decision log [4b.2]).
SCHEMA=1
NAME=opencode
KIND=agent
PROVIDES="opencode"
VERSION=latest
MCP_FORMAT=opencode
# --auto is accepted by `opencode` and `opencode run`, not before a subcommand (B2), so no alias is generated (6.6): only `yolo` uses it.
YOLO_FLAGS="--auto"
YOLO_ALIAS=0
