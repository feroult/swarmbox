# Voice control: whisper.cpp (built from source at install, CPU only), one multilingual Whisper model, and the small service and
# planners of the `voice` tool (docs/voice.md, docs/voice-design.md). A tool, so VERSION is pinned: it is the whisper.cpp release.
# The source tarball is the same for both architectures and its checksum is a constant of install.sh (WHISPER_SRC_SHA256), not a
# SHA256_<arch> key. Nothing is installed at image build: the first `swarmbox-voice` or `swarmbox tool install voice` builds it.
SCHEMA=1
NAME=voice
KIND=tool
PROVIDES="swarmbox-voice"
VERSION=1.9.5
