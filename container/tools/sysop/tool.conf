# The sysop: an agent loop that operates the box from a goal (docs/plugins-design.md). It subscribes to the topic of `sysop.topic` (default `goal`) of
# swarmbox-bus, in the group `sysop.group`, runs a brain (a command that speaks MCP, `claude -p` by default) and gives it a few tools that read
# and type into the tabs through the command swarmbox-tabs, never through the bus; the
# host rates every action, and the panel shows a countdown or asks first. Its own code only: stdlib Python, nothing is downloaded, so the
# install is a copy. A tool, so VERSION is pinned: it is the version of this code (swarmbox_sysop.__version__ must equal it).
# Today's manifest format: the rename of the manifest of the plugin model is not part of this tool.
SCHEMA=1
NAME=sysop
KIND=tool
PROVIDES="swarmbox-sysop"
VERSION=1.0.0
