# Claude Code (design 6.3, 6.7). An agent that updates itself (D3): installed once by the vendor's native installer, then left alone.
SCHEMA=1
NAME=claude
KIND=agent
PROVIDES="claude"
VERSION=latest
UPDATE=self
UPDATE_CMD="claude update"
YOLO_FLAGS="--dangerously-skip-permissions"
MCP_FLAGS="--mcp-config $HOME/.claude/mcp-servers.json"
