# SwarmBox CI.
#
# This workflow only runs commands that already exist in the repository today: the python3 unit and function tests,
# shellcheck over the new shell files, and (job "smoke") the image build and the full image smoke test
# (tests/smoke_image.py with SWARMBOX_SMOKE_FULL=1: it needs the nested Podman that the development box cannot give, so
# this job is its only full run, never run before the owner's first push). The arm64 job, the dash and busybox step of the linux job, and the `swarmbox` script and installer tests under macOS's /bin/sh
# (bash 3.2 in POSIX mode) in the macos job are included.
# It uses no secrets, publishes nothing and binds no ports on the runner outside 127.0.0.1.
#
# Open facts this file prepares (see "Not done, and open questions" in docs/design.md):
#   - the macOS runner exists and what it provides. The "probe" step of the macos job prints
#        /bin/bash --version and command -v podman. This stays [unverified] until the first real run of this job.
#   - the smoke job's step "nested-cgroup" (cgroupfs and file logger inside the box) is its first real check.
#   - the macos job also prints sort -V behavior as a probe only (no assertion).
#   - the arm64 job builds the image natively on an arm64 runner (no emulation) and runs the full smoke test. It has
#        never run: it is [unverified] until its first real run. The runner label ubuntu-24.04-arm is the one GitHub
#        documents for its arm64 hosted runners; if the account cannot use it the job stays queued or fails, and the
#        owner decides (record it in docs/history/decision-log.md). The jobs of this file were only validated by
#        tests/test_ci_workflow.py (and actionlint when present) in the development box: none of them ever ran.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:
  workflow_call: # called by release.yml as its test gate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (ubuntu-24.04, podman >= 4.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Podman version guard (needs 4.3 or newer; ubuntu-24.04 ships 4.9)
        run: |
          podman --version
          python3 - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(["podman", "--version"], capture_output=True, text=True, check=True).stdout
          v = tuple(int(x) for x in re.search(r"(\d+)\.(\d+)", out).groups())
          if v < (4, 3):
              sys.exit("podman %s is older than 4.3: pick a newer runner image or install Podman" % (v,))
          PY
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux busybox-static dash shellcheck
      - name: The shells the script tests need must exist (a missing shell fails the job, it is not skipped)
        run: |
          command -v bash dash busybox
          bash --version | head -n 1
      - name: Shellcheck the new shell files
        run: |
          shellcheck -s sh install.sh container/host/swarmbox-host container/scripts/swarmbox-install.sh container/scripts/dirs.sh container/scripts/swarmbox-shim.sh container/web/build-index.sh dev/dev-build.sh dev/gen-notices.sh dev/release-version.sh dev/release-check.sh dev/name-check.sh
          shellcheck -s bash container/entrypoint.sh container/scripts/swarmbox-attach.sh container/scripts/swarmbox-web.sh container/scripts/swarmbox-tool.sh container/config/bashrc.sh
      - name: Validate the tool manifests (swarmbox-tool validate, no container)
        run: container/scripts/swarmbox-tool.sh validate container/tools
      - name: The swarmbox script under dash and busybox sh
        run: |
          command -v dash
          command -v busybox
          busybox sh -c 'echo busybox sh works'
          python3 tests/test_host_shells.py
          python3 tests/test_host_create_flags.py
      - name: Unit tests (tests/run_all.sh; the browser and real-installer tests run in their own jobs)
        run: |
          # The failing files go to an annotation too, which is readable without a login (the log is not).
          if sh tests/run_all.sh > run_all.out 2>&1; then cat run_all.out; exit 0; fi
          cat run_all.out
          msg=$(grep -A15 ' FAIL ' run_all.out | head -c 8000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=run_all failed::$msg"
          exit 1

  # The image smoke test in full mode: the runner is level 1, the throwaway box level 2 and the
  # nested Podman inside it level 3, which is why the development box cannot run this. Image, containers and volumes are
  # named swarmbox-test-*; cleanup removes the image by its exact name. Nothing is pushed and no port is published.
  smoke:
    name: image smoke test (full, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SWARMBOX_IMAGE_TAG: swarmbox-test-img-ci
    steps:
      - uses: actions/checkout@v4
      - name: Podman version
        run: podman --version
      - name: Build the image (not pushed)
        run: podman build -t "$SWARMBOX_IMAGE_TAG" .
      - name: Smoke test, full (nested Podman)
        run: |
          SWARMBOX_SMOKE_FULL=1 python3 tests/smoke_image.py | tee smoke.out
          if grep -q ' SKIP ' smoke.out; then echo "a step was skipped in the full run"; exit 1; fi
      - name: Container tests on the same image (reduced switch inside)
        run: |
          export SWARMBOX_IMAGE_BUILD=1
          python3 tests/test_bashrc_container.py
          python3 tests/test_image_build.py
          python3 tests/test_image_with_tools.py
      - name: Remove the image
        if: always()
        run: podman rmi "$SWARMBOX_IMAGE_TAG" || true

  # The arm64 job: a native build on an arm64 hosted runner (no QEMU), the dev build script (it only adds
  # the APT sandbox line to a scratch copy of the Dockerfile, harmless on a runner), and the full smoke test. Nothing is
  # pushed, no registry login, no port. [unverified] that this job ever ran.
  arm64:
    name: arm64 (native build and full smoke test, ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      SWARMBOX_IMAGE_TAG: swarmbox-test-img-ci-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Runner architecture and Podman version (must be aarch64)
        run: |
          uname -m
          [ "$(uname -m)" = aarch64 ] || { echo "not an arm64 runner"; exit 1; }
          podman --version
      - name: Build the image for arm64 (not pushed)
        run: dev/dev-build.sh --tag "$SWARMBOX_IMAGE_TAG"
      - name: Smoke test, full (nested Podman, keep-id, Chromium)
        run: |
          SWARMBOX_SMOKE_FULL=1 python3 tests/smoke_image.py | tee smoke.out
          if grep -q ' SKIP ' smoke.out; then echo "a step was skipped in the full run"; exit 1; fi
      - name: Remove the image
        if: always()
        run: podman rmi "$SWARMBOX_IMAGE_TAG" || true

  macos:
    name: macos (/bin/sh is bash 3.2, fake podman)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe what the macOS runner provides
        run: |
          /bin/bash --version
          command -v podman || echo "podman: not found (the script tests use a fake podman)"
          python3 --version
          sw_vers
          printf '2.0.10\n2.0.9\n' | sort -V
      - name: /bin/sh must be a bash 3.x in POSIX mode (the macOS system shell), or this job proves nothing about it
        run: |
          /bin/bash -c 'echo "/bin/bash $BASH_VERSION"; [ "${BASH_VERSINFO[0]}" = 3 ]'
          /bin/sh -c 'echo "/bin/sh $BASH_VERSION"; [ "${BASH_VERSINFO[0]}" = 3 ]'
      - name: The swarmbox script and both installers under /bin/sh with a fake podman
        run: |
          python3 tests/test_swarmbox_command.py
          python3 tests/test_install.py
      - name: The other shell-level tests with a fake podman
        run: |
          python3 tests/test_build_index.py
          python3 tests/test_dev_build.py
          python3 tests/test_default_names_lint.py
          python3 tests/test_dirs.py
          python3 tests/test_dockerfile.py
          python3 tests/test_helpers.py
          python3 tests/test_host_config.py
          python3 tests/test_host_connector.py
          python3 tests/test_host_create_flags.py
          python3 tests/test_host_shells.py
          python3 tests/test_host_socket.py
          python3 tests/test_host_remote.py
          python3 tests/test_host_remote_e2e_fake.py
          python3 tests/test_host_up.py
          python3 tests/test_host_update.py
          python3 tests/test_image_build.py
          python3 tests/test_ssh_key.py
          python3 tests/test_starship.py
          python3 tests/test_cloudflare_setup.py
          python3 tests/test_ci_workflow.py
          python3 tests/test_docs_consistency.py
          python3 tests/test_name_check.py
          python3 tests/test_release_check.py
          python3 tests/test_release_version.py
          python3 tests/test_release_workflow.py
          python3 tests/test_third_party_notices.py
          python3 tests/test_security_review.py
          python3 tests/test_repo_files.py
          python3 tests/test_run_all.py

  # Browser tests are slow and need chromium and ttyd: they run on the weekly schedule (and by hand), in a Debian
  # container so that "chromium" is a real binary (on Ubuntu it is a snap stub).
  browser:
    name: browser tests (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:bookworm
    steps:
      - name: Install browser test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 tmux chromium ttyd
      - uses: actions/checkout@v4
      - name: Browser tests
        run: |
          python3 tests/test_clipboard_bridge.py
          python3 tests/test_web_style.py
          python3 tests/test_tmux_browser_keys.py

  # The real-installer tests: every tool of container/tools is installed for real in a throwaway container
  # ("no side effects", "survives a reset"). They download several hundred MB, so they run on the weekly schedule and by hand,
  # never on push. Nothing is pushed and no port is published. [unverified] that this job ever ran on a runner.
  real-tools:
    name: real installers (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SWARMBOX_IMAGE_TAG: swarmbox-test-img-ci-real
      SWARMBOX_TEST_NETWORK: "1"
      SWARMBOX_IMAGE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Podman version
        run: podman --version
      - name: Build the image (not pushed)
        run: podman build -t "$SWARMBOX_IMAGE_TAG" .
      - name: Real installers, one table row per tool
        shell: bash
        run: |
          set -o pipefail
          python3 tests/test_tool_real.py 2>&1 | tee real.out
          if grep -q 'skipped' real.out; then echo "real tests were skipped"; exit 1; fi
      - name: Remove the image
        if: always()
        run: podman rmi "$SWARMBOX_IMAGE_TAG" || true
