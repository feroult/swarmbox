# SwarmBox CI (design 13.4, plan section 3).
#
# This workflow only runs commands that already exist in the repository today: the python3 unit and function tests,
# shellcheck over the new shell files, and (job "smoke", slice 2.7) the image build and the full image smoke test
# (tests/smoke_image.py with SWARMBOX_SMOKE_FULL=1: it needs the nested Podman that the development box cannot give, so
# this job is its only full run, never run before the owner's first push). Phase 4a added the real swarmbox-tool validate
# step (linux job). The zsh and fish function tests arrived in slice 3.5; the arm64 job (B31) is a later phase and is not here on purpose.
# It uses no secrets, publishes nothing and binds no ports on the runner outside 127.0.0.1.
#
# Open facts this file prepares (see docs/design.md Part B):
#   B30  the macOS runner exists and what it provides. The "probe" step of the macos job prints
#        /bin/bash --version and command -v podman. B30 stays [unverified] until the first real run of this job.
#   B28  the smoke job's step "nested-cgroup" (cgroupfs and file logger inside the box) is its first real check.
#   B19  the macos job also prints sort -V behavior as a probe only (no assertion).
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (ubuntu-24.04, podman >= 4.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Podman version guard (needs 4.3 or newer; ubuntu-24.04 ships 4.9)
        run: |
          podman --version
          python3 - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(["podman", "--version"], capture_output=True, text=True, check=True).stdout
          v = tuple(int(x) for x in re.search(r"(\d+)\.(\d+)", out).groups())
          if v < (4, 3):
              sys.exit("podman %s is older than 4.3: pick a newer runner image or install Podman" % (v,))
          PY
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux zsh fish shellcheck
      - name: Shellcheck the new shell files
        run: |
          shellcheck -s sh container/host/swarmbox-host container/scripts/swarmbox-init.sh container/scripts/dirs.sh container/scripts/swarmbox-shim.sh container/web/build-index.sh dev/dev-build.sh
          shellcheck -s bash container/entrypoint.sh container/scripts/swarmbox-attach.sh container/scripts/swarmbox-web.sh container/scripts/swarmbox-tool.sh container/config/bashrc.sh
      - name: Validate the tool manifests (swarmbox-tool validate, no container)
        run: container/scripts/swarmbox-tool.sh validate container/tools
      - name: Unit and function tests
        run: |
          python3 tests/test_attach_command.py
          python3 tests/test_attach_container.py
          python3 tests/test_bashrc_container.py
          python3 tests/test_bashrc_fragment.py
          python3 tests/test_build_index.py
          python3 tests/test_ci_workflow.py
          python3 tests/test_cloudflare_setup.py
          python3 tests/test_design_partb.py
          python3 tests/test_dev_build.py
          python3 tests/test_dirs.py
          python3 tests/test_dockerfile.py
          python3 tests/test_docs_consistency.py
          python3 tests/test_entrypoint.py
          python3 tests/test_helpers.py
          python3 tests/test_function_bash.py
          python3 tests/test_function_fish.py
          python3 tests/test_function_zsh.py
          python3 tests/test_host_config.py
          python3 tests/test_host_create_flags.py
          python3 tests/test_host_shells.py
          python3 tests/test_host_socket.py
          python3 tests/test_host_up.py
          python3 tests/test_history_audit.py
          python3 tests/test_init_output.py
          python3 tests/test_image_build.py
          python3 tests/test_migration.py
          python3 tests/test_pubkey_ensure.py
          python3 tests/test_repo_files.py
          python3 tests/test_serve_container.py
          python3 tests/test_serve_steps.py
          python3 tests/test_smoke_skeleton.py
          python3 tests/test_spikes_common.py
          python3 tests/test_ssh_key.py
          python3 tests/test_starship.py
          python3 tests/test_start_attach.py
          python3 tests/test_start_fake_podman.py
          python3 tests/test_start_init.py
          python3 tests/test_start_timezone.py
          python3 tests/test_start_web_connector.py
          python3 tests/test_tool_install.py
          python3 tests/test_tool_link.py
          python3 tests/test_tool_manifest.py
          python3 tests/test_tool_claude_real.py
          python3 tests/test_tool_shim.py
          python3 tests/test_tool_stub.py
          python3 tests/test_web_build.py
          python3 tests/test_web_container.py
          python3 tests/test_web_terminal.py

  # The image smoke test (design 13.3 layer 2) in full mode: the runner is level 1, the throwaway box level 2 and the
  # nested Podman inside it level 3, which is why the development box cannot run this. Image, containers and volumes are
  # named swarmbox-test-*; cleanup removes the image by its exact name. Nothing is pushed and no port is published.
  smoke:
    name: image smoke test (full, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SWARMBOX_IMAGE_TAG: swarmbox-test-img-ci
    steps:
      - uses: actions/checkout@v4
      - name: Podman version
        run: podman --version
      - name: Build the image (not pushed)
        run: podman build -t "$SWARMBOX_IMAGE_TAG" .
      - name: Smoke test, full (nested Podman, B28)
        run: |
          SWARMBOX_SMOKE_FULL=1 python3 tests/smoke_image.py | tee smoke.out
          if grep -q ' SKIP ' smoke.out; then echo "a step was skipped in the full run"; exit 1; fi
      - name: Container tests on the same image (reduced switch inside)
        run: |
          export SWARMBOX_IMAGE_BUILD=1
          python3 tests/test_serve_container.py
          python3 tests/test_attach_container.py
          python3 tests/test_bashrc_container.py
          python3 tests/test_web_container.py
          python3 tests/test_image_build.py
      - name: Remove the image
        if: always()
        run: podman rmi "$SWARMBOX_IMAGE_TAG" || true

  macos:
    name: macos (bash 3.2, fake podman)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe for B30 (what the macOS runner provides)
        run: |
          /bin/bash --version
          command -v podman || echo "podman: not found (the function tests use a fake podman)"
          python3 --version
          sw_vers
          printf '2.0.10\n2.0.9\n' | sort -V
      - name: Function tests under bash 3.2 with a fake podman
        run: |
          python3 tests/test_build_index.py
          python3 tests/test_dev_build.py
          python3 tests/test_dirs.py
          python3 tests/test_dockerfile.py
          python3 tests/test_helpers.py
          python3 tests/test_function_bash.py
          python3 tests/test_function_fish.py
          python3 tests/test_function_zsh.py
          python3 tests/test_host_config.py
          python3 tests/test_host_create_flags.py
          python3 tests/test_host_shells.py
          python3 tests/test_host_socket.py
          python3 tests/test_host_up.py
          python3 tests/test_image_build.py
          python3 tests/test_init_output.py
          python3 tests/test_smoke_skeleton.py
          python3 tests/test_start_fake_podman.py
          python3 tests/test_start_init.py
          python3 tests/test_start_timezone.py
          python3 tests/test_ssh_key.py
          python3 tests/test_starship.py
          python3 tests/test_start_web_connector.py
          python3 tests/test_cloudflare_setup.py
          python3 tests/test_ci_workflow.py
          python3 tests/test_design_partb.py
          python3 tests/test_docs_consistency.py
          python3 tests/test_repo_files.py

  # Browser tests are slow and need chromium and ttyd: they run on the weekly schedule (and by hand), in a Debian
  # container so that "chromium" is a real binary (on Ubuntu it is a snap stub).
  browser:
    name: browser tests (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:bookworm
    steps:
      - name: Install browser test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 tmux chromium ttyd
      - uses: actions/checkout@v4
      - name: Browser tests
        run: |
          python3 tests/test_clipboard_bridge.py
          python3 tests/test_web_style.py
          python3 tests/test_tmux_browser_keys.py
